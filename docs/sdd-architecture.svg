<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HabiView layered software architecture">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1118"/><stop offset="1" stop-color="#080C10"/>
    </linearGradient>
    <linearGradient id="a-em" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="a-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="18" fill="url(#a-bg)" stroke="#10B981" stroke-opacity="0.28"/>
  <text x="32" y="44" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="900" font-size="21">HabiView · Layered Architecture</text>
  <text x="32" y="65" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="11">Presentation → Application → Data</text>

  <!-- Presentation layer -->
  <rect x="40" y="96" width="880" height="132" rx="16" fill="#11171F" stroke="#F97316" stroke-opacity="0.5"/>
  <text x="60" y="122" fill="#FDBA74" font-family="ui-monospace,monospace" font-weight="800" font-size="10" letter-spacing="1.4">01 · PRESENTATION LAYER</text>
  <rect x="60" y="136" width="180" height="70" rx="11" fill="#151D27" stroke="#F97316" stroke-opacity="0.3"/>
  <text x="150" y="164" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">base.html</text>
  <text x="150" y="184" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Command bar · Modal · Footer</text>
  <rect x="256" y="136" width="180" height="70" rx="11" fill="#151D27" stroke="#F97316" stroke-opacity="0.3"/>
  <text x="346" y="164" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">index.html</text>
  <text x="346" y="184" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Orbit · Cards · Heatmap</text>
  <rect x="452" y="136" width="180" height="70" rx="11" fill="#151D27" stroke="#F97316" stroke-opacity="0.3"/>
  <text x="542" y="164" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">habiview.css</text>
  <text x="542" y="184" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Obsidian glass theme</text>
  <rect x="648" y="136" width="252" height="70" rx="11" fill="#151D27" stroke="#F97316" stroke-opacity="0.3"/>
  <text x="774" y="164" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">habiview.js</text>
  <text x="774" y="184" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Fetch API · SVG rings · Ripple · Tooltips</text>

  <!-- Application layer -->
  <rect x="40" y="270" width="880" height="166" rx="16" fill="#11171F" stroke="#10B981" stroke-opacity="0.6"/>
  <text x="60" y="296" fill="#34D399" font-family="ui-monospace,monospace" font-weight="800" font-size="10" letter-spacing="1.4">02 · APPLICATION LAYER (app.py)</text>
  <rect x="60" y="310" width="196" height="100" rx="11" fill="#151D27" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="158" y="340" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">Routes</text>
  <text x="158" y="360" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">/ · /api/dashboard</text>
  <text x="158" y="378" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">/api/toggle/&lt;id&gt;</text>
  <text x="158" y="396" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">/api/habits · /api/analytics</text>
  <rect x="272" y="310" width="196" height="100" rx="11" fill="#151D27" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="370" y="340" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">Streak Engine</text>
  <text x="370" y="362" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">current_streak()</text>
  <text x="370" y="382" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">longest_streak()</text>
  <text x="370" y="400" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">week_dots()</text>
  <rect x="484" y="310" width="196" height="100" rx="11" fill="#151D27" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="582" y="340" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">Analytics Builder</text>
  <text x="582" y="362" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">90-day heatmap</text>
  <text x="582" y="382" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">30-day category rates</text>
  <text x="582" y="400" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">progress + summary</text>
  <rect x="696" y="310" width="204" height="100" rx="11" fill="#151D27" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="798" y="340" text-anchor="middle" fill="#F8FAFC" font-family="system-ui,sans-serif" font-weight="700" font-size="13">Validation</text>
  <text x="798" y="362" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Input length / category</text>
  <text x="798" y="382" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">Parameterized SQL</text>
  <text x="798" y="400" text-anchor="middle" fill="#8A9BAB" font-family="ui-monospace,monospace" font-size="9">400 / 404 responses</text>

  <!-- Data layer -->
  <rect x="40" y="478" width="880" height="92" rx="16" fill="#11171F" stroke="#8B5CF6" stroke-opacity="0.6"/>
  <text x="60" y="504" fill="#C4B5FD" font-family="ui-monospace,monospace" font-weight="800" font-size="10" letter-spacing="1.4">03 · DATA LAYER</text>
  <rect x="60" y="514" width="380" height="42" rx="10" fill="#151D27" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="250" y="540" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace,monospace" font-size="12">habits (id, name, category, icon, created_at)</text>
  <rect x="456" y="514" width="444" height="42" rx="10" fill="#151D27" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="678" y="540" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace,monospace" font-size="12">habit_logs (habit_id, log_date, completed) · UNIQUE</text>

  <path d="M480 228V262" stroke="#10B981" stroke-width="2" marker-end="url(#a-arrow)"/>
  <path d="M480 436V470" stroke="#10B981" stroke-width="2" marker-end="url(#a-arrow)"/>
  <text x="492" y="250" fill="#34D399" font-family="ui-monospace,monospace" font-size="9">Fetch / JSON</text>
  <text x="492" y="460" fill="#34D399" font-family="ui-monospace,monospace" font-size="9">sqlite3</text>

  <text x="920" y="580" text-anchor="end" fill="#5C6B7A" font-family="ui-monospace,monospace" font-size="10">HabiView · Raj Gautam</text>
</svg>
